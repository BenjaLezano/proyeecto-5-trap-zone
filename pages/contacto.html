<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacto | TrapZone</title>
  <!-- Bootstrap CSS CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles/styles.css">
</head>
<body>
  <!-- Navbar Responsivo de Bootstrap -->
  <header>
    <nav class="navbar navbar-expand-lg navbar-trapzone">
      <div class="container-fluid">
        <a class="navbar-brand logotipo" href="../index.html">TrapZone</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
          <ul class="navbar-nav gap-3">
            <li class="nav-item"><a class="nav-link" href="../index.html">Inicio</a></li>
            <li class="nav-item"><a class="nav-link" href="sobre-mi.html">Artistas</a></li>
            <li class="nav-item"><a class="nav-link" href="proyectos.html">Lanzamientos</a></li>
            <li class="nav-item"><a class="nav-link" href="servicios.html">Producción</a></li>
            <li class="nav-item"><a class="nav-link active" href="contacto.html">Contacto</a></li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <main class="contenedor-principal">
    <section class="seccion-hero">
      <h1 class="titulo-principal">Contacto &amp; Booking</h1>
      <p class="texto-destacado">
        ¿Te interesa proponer un feat, enviar una maqueta o gestionar fechas de shows? Déjanos un mensaje.
      </p>
    </section>

    <section class="seccion-contenido">
      <h2 class="subtitulo-seccion">Envía tu Consulta</h2>
      <form action="#" method="POST" class="formulario-contacto">
        <div class="grupo-formulario">
          <label for="nombre-contacto" class="etiqueta-campo">Nombre o Productora</label>
          <input type="text" id="nombre-contacto" name="nombre" class="campo-texto" placeholder="Ej. El Combo Records" required>
        </div>

        <div class="grupo-formulario">
          <label for="correo-contacto" class="etiqueta-campo">Correo electrónico</label>
          <input type="email" id="correo-contacto" name="email" class="campo-texto" placeholder="contacto@sello.com" required>
        </div>

        <div class="grupo-formulario">
          <label for="asunto-contacto" class="etiqueta-campo">Artista o Motivo de consulta</label>
          <input type="text" id="asunto-contacto" name="asunto" class="campo-texto" placeholder="Ej. Feat con Juicy Nise / Cris Mj" required>
        </div>

        <div class="grupo-formulario">
          <label for="mensaje-contacto" class="etiqueta-campo">Detalles del mensaje</label>
          <textarea id="mensaje-contacto" name="mensaje" rows="5" class="area-texto" placeholder="Cuéntanos detalles de la propuesta o fechas..." required></textarea>
        </div>

        <button type="submit" class="boton-primario boton-envio" tabindex="0">Enviar Consulta</button>
      </form>
    </section>
  </main>

  <footer class="pie-pagina">
    <p class="texto-copyright">&copy; 2026 TrapZone Web. Todos los derechos reservados.</p>
  </footer>

  <!-- Bootstrap JS Bundle CDN -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
